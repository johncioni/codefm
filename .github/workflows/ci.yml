name: ci

# This repo originally had no build or test CI. Closes FM-7.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this gate never writes back.
permissions:
  contents: read

jobs:
  ci:
    # macOS, not ubuntu: CodeFM is an AppKit app linking WebKit, AVFoundation,
    # ServiceManagement and Carbon, so it cannot build on Linux Swift.
    # macos-15 rather than macos-latest -- a floating label silently changes the
    # toolchain under a required check, and when the image is retired an
    # explicit label fails loudly instead of drifting. Matches
    # rawdog-printworks/tests.yml.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      # SHA-pinned: a retargeted tag could run different action code inside the
      # build gate. persist-credentials: false so no usable git token is left
      # on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Printed, not asserted: Package.swift declares swift-tools-version 5.9
      # and macOS 13, so a newer toolchain is fine. Recording it makes a
      # toolchain change visible in the log when a build starts behaving
      # differently, instead of being invisible.
      - name: Record the toolchain
        run: swift --version

      - name: Build
        run: swift build

      # The XCTest suite in Tests/CodeFMTests.
      - name: Test
        run: swift test

  lint:
    # macos-15 like the ci job: SwiftLint loads SourceKit from the runner's
    # Xcode, as it does on a dev Mac, so results match a local run.
    runs-on: macos-15
    timeout-minutes: 10
    env:
      # Pinned and hash-checked rather than the runner's preinstalled
      # swiftlint, which changes with the image: a new SwiftLint can add or
      # change rule behavior under a required check. Renovate bumps both lines
      # (customManagers in renovate.json5) with the new release's
      # portable_swiftlint.zip hash; keep them adjacent, version first. A bump
      # PR that fails the checksum kept the old hash: update it by hand.
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" version

      # Same command as the local gate in CLAUDE.md. The baseline holds the
      # violations that predate this job, so only new ones fail it.
      - name: Lint
        run: |
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict --no-cache --baseline .swiftlint-baseline.json
