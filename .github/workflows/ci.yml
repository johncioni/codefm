name: ci

# This repo originally had NO build or test CI: a review bot was the only
# required check, so branch protection was guarding a repo where nothing
# verified that the code compiles. Closes FM-7.
#
# SwiftLint is NOT run here. Until 2026-08-30 CodeRabbit linted each PR's
# changed Swift files; that account is cancelled, so Swift lint currently has
# no automated runner. .swiftlint.yml is written for incremental adoption, so
# adding a whole-repo lint job needs its own ticket rather than a drive-by.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this gate never writes back.
permissions:
  contents: read

jobs:
  ci:
    # macOS, not ubuntu: CodeFM is an AppKit app linking WebKit, AVFoundation,
    # ServiceManagement and Carbon, so it cannot build on Linux Swift.
    # macos-15 rather than macos-latest -- a floating label silently changes the
    # toolchain under a required check, and when the image is retired an
    # explicit label fails loudly instead of drifting. Matches
    # rawdog-printworks/tests.yml.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      # SHA-pinned: a retargeted tag could run different action code inside the
      # build gate. persist-credentials: false so no usable git token is left
      # on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Printed, not asserted: Package.swift declares swift-tools-version 5.9
      # and macOS 13, so a newer toolchain is fine. Recording it makes a
      # toolchain change visible in the log when a build starts behaving
      # differently, instead of being invisible.
      - name: Record the toolchain
        run: swift --version

      - name: Build
        run: swift build

      # 21 tests across 5 files in Tests/CodeFMTests.
      - name: Test
        run: swift test
